<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Editor Novela</title>
    <style>
      body {
        font-family: Arial;
        max-width: 900px;
        margin: 30px auto;
        padding: 20px;
      }
      textarea {
        width: 100%;
        height: 400px;
      }
      label {
        display: block;
        margin-top: 10px;
      }
      button {
        padding: 12px 20px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Girls Love Play - Editor de Novelas</h1>
    <label>Episodio <input id="ep" type="number" value="1" /></label>
    <label>Parte <input id="parte" type="number" value="1" /></label>
    <label
      >Título <input id="titulo" value="La que nadie ve" style="width: 100%"
    /></label>
    <label>Tiempo de lectura <input id="tiempo" value="5 min" /></label>
    <label>Texto</label>
    <textarea id="txt" placeholder="Escribí la novela aquí..."></textarea>
    <button onclick="generar()">Generar HTML</button>
    <script>
      function esc(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function generar() {
        const ep = document.getElementById("ep").value;
        const parte = document.getElementById("parte").value;
        const titulo = document.getElementById("titulo").value;
        const tiempo = document.getElementById("tiempo").value;
        const lineas = document
          .getElementById("txt")
          .value.trim()
          .split(/\n\s*\n/);
        let cuerpo = "<!-- NOVELA-INICIO -->\n";
        lineas.forEach((p) => {
          if (p.trim())
            cuerpo += "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>\n";
        });
        cuerpo += "<!-- NOVELA-FIN -->";

        const tituloTag =
          "Episodio " +
          ep +
          ", Parte " +
          parte +
          ": " +
          titulo +
          " - Girls Love Play";
        const h1 = "Parte " + parte;
        const progreso =
          "Parte " + parte + " de 3 · ~" + tiempo + " de lectura";

        const datos =
          "TITLE (etiqueta <title>):\n" +
          tituloTag +
          "\n\nH1 (encabezado de la parte):\n" +
          h1 +
          "\n\nLINEA DE PROGRESO:\n" +
          progreso;

        const w = window.open();
        w.document.write(
          '<!DOCTYPE html><meta charset="utf-8"><title>Copiar al capítulo</title>' +
            "<h2>1. Datos sueltos (para title, h1 y progreso)</h2>" +
            '<textarea style="width:100%;height:15vh">' +
            datos.replace(/</g, "&lt;") +
            "</textarea>" +
            "<h2>2. Cuerpo del texto (para entre los marcadores NOVELA)</h2>" +
            '<textarea style="width:100%;height:55vh">' +
            cuerpo.replace(/</g, "&lt;") +
            "</textarea>"
        );
      }
    </script>
  </body>
</html>
